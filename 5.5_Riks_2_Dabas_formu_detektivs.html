<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#3b2f25;
  font-family:Candara,"Segoe UI","Trebuchet MS",Verdana,Arial,sans-serif;color:#2d2118;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:0 0;
  background:#fbf5e9;overflow:hidden}
#top{position:absolute;left:0;top:0;width:1600px;height:84px;background:#7a4a1e;color:#fff8ea;
  display:flex;align-items:center;padding:0 34px;gap:22px}
#top h1{font-size:36px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
#top .sub{font-size:23px;opacity:.92;flex:1;line-height:1.2}
#top .tag{font-size:19px;background:#fff8ea;color:#7a4a1e;border-radius:20px;padding:6px 16px;font-weight:700;white-space:nowrap}
#main{position:absolute;left:0;top:84px;width:1600px;height:724px}
#bar{position:absolute;left:0;top:808px;width:1600px;height:92px;background:#efe3cc;border-top:3px solid #d9c6a3;
  display:flex;align-items:center;padding:0 26px;gap:16px}
#bar .sp{flex:1}
#msg{font-size:23px;font-weight:700;color:#5b3a17;flex:1;line-height:1.15;padding-right:10px;max-height:80px;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none}
.btn{height:62px;min-width:150px;padding:0 26px;border-radius:14px;font-size:25px;font-weight:700;
  background:#c75000;color:#fff;box-shadow:0 4px 0 #8f3a00}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8f3a00}
.btn.alt{background:#1f4e79;box-shadow:0 4px 0 #14334f}
.btn.alt:active{box-shadow:0 1px 0 #14334f}
.btn.soft{background:#fff8ea;color:#5b3a17;box-shadow:0 4px 0 #c9b48d;border:2px solid #c9b48d}
.btn.soft:active{box-shadow:0 1px 0 #c9b48d}
.btn[disabled]{opacity:.4;cursor:default}
#fs{background:#3b2f25;color:#fff8ea;box-shadow:0 4px 0 #1d1711;font-size:21px;min-width:0;padding:0 20px}
.ok{color:#1d6b2f}.bad{color:#b3261e}
.hidden{display:none!important}

#q{position:absolute;left:40px;top:14px;width:1520px;height:112px;display:flex;align-items:center;gap:20px}
#qn{flex:0 0 auto;width:92px;height:92px;border-radius:50%;background:#c75000;color:#fff;font-size:32px;font-weight:700;display:flex;align-items:center;justify-content:center}
#qt{font-size:34px;font-weight:700;line-height:1.15;color:#3b2a1a}
/* A: attēlu izvēles */
#optsA{position:absolute;left:40px;top:150px;width:1520px;height:306px;display:flex;gap:26px;justify-content:center}
.optA{flex:0 0 490px;border-radius:16px;overflow:hidden;border:7px solid #fff;box-shadow:0 4px 12px rgba(60,40,10,.35);cursor:pointer;position:relative;background:#fff}
.optA img{width:100%;height:100%;object-fit:cover;display:block}
.optA .let{position:absolute;left:10px;top:10px;width:52px;height:52px;border-radius:50%;background:#1f4e79;color:#fff;font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center}
.optA.good{border-color:#2e8b47}.optA.wrong{border-color:#c62828}.optA.dim{opacity:.45}
#expl{position:absolute;left:40px;top:486px;width:1520px;height:220px;display:block;background:#fff;border-radius:16px;border:3px solid #d9c6a3;padding:20px 28px;font-size:30px;line-height:1.35}
#expl b{color:#7a4a1e}
/* B: attēls + teksta izvēles */
#picB{position:absolute;left:40px;top:140px;width:800px;height:566px;border-radius:16px;overflow:hidden;border:6px solid #fff;box-shadow:0 4px 12px rgba(60,40,10,.35);background:#222}
#picB img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .9s ease}
#picB .zl{position:absolute;right:12px;bottom:12px;background:rgba(45,33,24,.8);color:#fff;font-size:20px;border-radius:10px;padding:5px 12px}
#optsB{position:absolute;left:870px;top:140px;width:690px;display:flex;flex-direction:column;gap:14px}
.optB{min-height:74px;border-radius:14px;background:#fff;border:4px solid #c9b48d;font-size:28px;font-weight:700;color:#3b2a1a;text-align:left;padding:10px 20px;display:flex;align-items:center;gap:16px;line-height:1.15}
.optB .let{flex:0 0 auto;width:46px;height:46px;border-radius:50%;background:#1f4e79;color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center}
.optB.good{border-color:#2e8b47;background:#e6f4ea}.optB.wrong{border-color:#c62828;background:#fdecea}.optB.dim{opacity:.5}
#explB{position:absolute;left:870px;top:498px;width:690px;height:208px;background:#fff;border-radius:16px;border:3px solid #d9c6a3;padding:14px 20px;font-size:25px;line-height:1.28}
#end{position:absolute;inset:0;background:#fbf5e9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center}
#end h2{font-size:64px;color:#7a4a1e}#end p{font-size:34px;max-width:1100px;line-height:1.3}
</style>

'use strict';
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
let SCALE=1;
function fit(){const st=$('#stage');const s=Math.min(innerWidth/1600,innerHeight/900);SCALE=s;
  st.style.transform='translate(-50%,-50%) scale('+s+')';st.style.transformOrigin='50% 50%';
  st.style.left='50%';st.style.top='50%';st.style.marginLeft='0';
  st.style.transform='translate(-50%,-50%) scale('+s+')';}
addEventListener('resize',fit);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function msg(t,cls){const m=$('#msg');if(!m)return;m.textContent=t||'';m.className=cls||'';}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
/* stage koordinātas no rādītāja notikuma */
function spt(ev){const r=$('#stage').getBoundingClientRect();return {x:(ev.clientX-r.left)/r.width*1600,y:(ev.clientY-r.top)/r.height*900};}
function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement||null;}
function fsToggle(){const d=document.documentElement;
  try{ if(!fsEl()){ const f=d.requestFullscreen||d.webkitRequestFullscreen; if(!f){fsNo();return;}
        const p=f.call(d); if(p&&p.catch)p.catch(fsNo); }
       else { (document.exitFullscreen||document.webkitExitFullscreen).call(document); } }catch(e){fsNo();}}
function fsNo(){msg('Pilnekrāna režīms šajā lapā nav atļauts. Atver rīku jaunā cilnē.','bad');}
function fsLabel(){const b=$('#fs');if(b)b.textContent=fsEl()?'Aizvērt pilnekrāna režīmu':'Atvērt pilnekrāna režīmu';}
document.addEventListener('fullscreenchange',fsLabel);document.addEventListener('webkitfullscreenchange',fsLabel);
addEventListener('DOMContentLoaded',()=>{fit();const b=$('#fs');if(b){b.addEventListener('click',fsToggle);fsLabel();}});
/* taimeris ar Sākt/Apturēt */
function makeTimer(disp,secs,onEnd){let left=secs,id=null;
  const show=()=>{const m=Math.floor(left/60),s=left%60;disp.textContent=m+':'+String(s).padStart(2,'0');};
  show();
  return {start(){if(id||left<=0)return;id=setInterval(()=>{left--;show();if(left<=0){clearInterval(id);id=null;if(onEnd)onEnd();}},1000);},
          stop(){if(id){clearInterval(id);id=null;}},
          reset(n){this.stop();left=(n!=null?n:secs);secs=left;show();},
          running(){return !!id;},left(){return left;}};}


function Quiz(cfg){
  const main=$('#main');let order,i,score,locked;
  const LET=['A','B','C','D'];
  function start(){order=cfg.shuffleQ===false?cfg.q.slice():shuffle(cfg.q);i=0;score=0;show();}
  function show(){locked=false;const Q=order[i];main.innerHTML='';
    const q=el('div');q.id='q';const n=el('div',null,(i+1)+'/'+order.length);n.id='qn';const t=el('div',null,Q.t);t.id='qt';q.append(n,t);main.appendChild(q);
    const opts=shuffle(Q.o.map((o,k)=>({o,ok:k===0})));
    if(cfg.mode==='A'){const w=el('div');w.id='optsA';
      opts.forEach((x,k)=>{const d=el('div','optA');const im=el('img');im.src=IMG[x.o];im.alt='Variants '+LET[k];im.draggable=false;d.append(im,el('div','let',LET[k]));
        d.addEventListener('click',()=>pick(d,x.ok,w,Q));d.dataset.ok=x.ok?'1':'';w.appendChild(d);});
      main.appendChild(w);const e=el('div');e.id='expl';e.textContent='Aplūko visus trīs variantus un pieskaries tam, kurš der vislabāk.';main.appendChild(e);}
    else{const p=el('div');p.id='picB';const im=el('img');im.src=IMG[Q.img];im.alt='';im.draggable=false;
      if(Q.zoom){im.style.transformOrigin=Q.zoom[0]+'% '+Q.zoom[1]+'%';im.style.transform='scale('+Q.zoom[2]+')';p.appendChild(im);p.appendChild(el('div','zl','Tuvplāns'));}
      else p.appendChild(im);
      main.appendChild(p);const w=el('div');w.id='optsB';
      opts.forEach((x,k)=>{const b=el('button','optB');b.append(el('span','let',LET[k]),el('span',null,x.o));b.dataset.ok=x.ok?'1':'';
        b.addEventListener('click',()=>pick(b,x.ok,w,Q));w.appendChild(b);});
      main.appendChild(w);const e=el('div');e.id='explB';e.textContent=cfg.hint||'Aplūko attēlu un izvēlies atbildi.';main.appendChild(e);}
    msg('Jautājums '+(i+1)+' no '+order.length+'. Punkti: '+score+'.');$('#next').disabled=true;
    $('#next').textContent=(i<order.length-1)?'Nākamais jautājums':'Rezultāts';}
  function pick(d,ok,w,Q){if(locked)return;locked=true;
    Array.from(w.children).forEach(c=>{if(c.dataset.ok)c.classList.add('good');else if(c===d)c.classList.add('wrong');else c.classList.add('dim');});
    if(ok)score++;
    const e=$('#expl')||$('#explB');e.innerHTML='';const b=el('b',null,ok?'Pareizi! ':'Šoreiz ne. ');e.append(b,document.createTextNode(Q.e));
    const im=$('#picB img');if(im){im.style.transform='scale(1)';const z=$('#picB .zl');if(z)z.textContent=cfg.fullLabel||'Viss darbs';}
    msg(ok?'Pareizi!':'Pareizā atbilde ir zaļā rāmī.',ok?'ok':'bad');$('#next').disabled=false;}
  function end(){main.innerHTML='';const e=el('div');e.id='end';const all=order.length;
    e.append(el('h2',null,'Rezultāts: '+score+' no '+all),el('p',null,score===all?cfg.endAll:(score>=all*0.6?cfg.endGood:cfg.endTry)));
    main.appendChild(e);msg('');$('#next').disabled=true;}
  $('#next').addEventListener('click',()=>{if(i<order.length-1){i++;show();}else end();});
  $('#again').addEventListener('click',start);
  start();
}

, "Šūnas (sešstūri)"], "e": "Tas ir pārgriezts ābols. Stari no centra: vienādas daļas izkārtotas ap viduspunktu."}], "hint": "Tu redzi tikai tuvplānu. Meklē, kā izkārtotas līnijas un laukumi.", "endAll": "Lieliski! Tu redzi dabas formas kā mākslinieks. Šīs formas vari izmantot savā darbā.", "endGood": "Labi! Dabā formas atkārtojas: spirāle, zarojums, simetrija, šūnas, stari.", "endTry": "Izmēģini vēlreiz. Vēro, vai forma griežas, dalās, atkārtojas vai atspoguļojas."}));
