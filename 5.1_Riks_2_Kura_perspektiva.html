<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kura perspektīva?</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#3b2f25;
  font-family:Candara,"Segoe UI","Trebuchet MS",Verdana,Arial,sans-serif;color:#2d2118;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:0 0;
  background:#fbf5e9;overflow:hidden}
#top{position:absolute;left:0;top:0;width:1600px;height:84px;background:#7a4a1e;color:#fff8ea;
  display:flex;align-items:center;padding:0 34px;gap:22px}
#top h1{font-size:36px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
#top .sub{font-size:23px;opacity:.92;flex:1;line-height:1.2}
#top .tag{font-size:19px;background:#fff8ea;color:#7a4a1e;border-radius:20px;padding:6px 16px;font-weight:700;white-space:nowrap}
#main{position:absolute;left:0;top:84px;width:1600px;height:724px}
#bar{position:absolute;left:0;top:808px;width:1600px;height:92px;background:#efe3cc;border-top:3px solid #d9c6a3;
  display:flex;align-items:center;padding:0 26px;gap:16px}
#bar .sp{flex:1}
#msg{font-size:23px;font-weight:700;color:#5b3a17;flex:1;line-height:1.15;padding-right:10px;max-height:80px;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none}
.btn{height:62px;min-width:150px;padding:0 26px;border-radius:14px;font-size:25px;font-weight:700;
  background:#c75000;color:#fff;box-shadow:0 4px 0 #8f3a00}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8f3a00}
.btn.alt{background:#1f4e79;box-shadow:0 4px 0 #14334f}
.btn.alt:active{box-shadow:0 1px 0 #14334f}
.btn.soft{background:#fff8ea;color:#5b3a17;box-shadow:0 4px 0 #c9b48d;border:2px solid #c9b48d}
.btn.soft:active{box-shadow:0 1px 0 #c9b48d}
.btn[disabled]{opacity:.4;cursor:default}
#fs{background:#3b2f25;color:#fff8ea;box-shadow:0 4px 0 #1d1711;font-size:21px;min-width:0;padding:0 20px}
.ok{color:#1d6b2f}.bad{color:#b3261e}
.hidden{display:none!important}

#deckWrap{position:absolute;left:26px;top:12px;width:1548px;height:318px;background:#f3e8d2;border-radius:18px;border:3px dashed #c9b48d}
#deckLbl{position:absolute;left:20px;top:8px;font-size:21px;color:#7a4a1e;font-weight:700}
#deck{position:absolute;left:14px;top:36px;right:14px;bottom:6px;display:flex;flex-wrap:wrap;gap:12px;align-content:flex-start;justify-content:center}
.card{width:var(--cw,236px);height:var(--ch,132px);border-radius:12px;overflow:hidden;background:#fff;border:4px solid #fff;
  box-shadow:0 3px 8px rgba(60,40,10,.35);position:relative;cursor:grab;touch-action:none;flex:0 0 auto}
.card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.card .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(45,33,24,.78);color:#fff;font-size:17px;padding:3px 8px;text-align:center;pointer-events:none}
.card.sel{border-color:#c75000;box-shadow:0 0 0 4px #c75000,0 6px 14px rgba(0,0,0,.4)}
.card.drag{position:absolute;z-index:50;cursor:grabbing;box-shadow:0 12px 24px rgba(0,0,0,.45);pointer-events:none}
.card.good{border-color:#2e8b47}.card.wrong{border-color:#c62828}
#fb{position:absolute;left:26px;top:338px;width:1548px;height:70px;background:#fff;border:4px solid #c9b48d;border-radius:14px;padding:0 20px;font-size:25px;font-weight:700;color:#3b2a1a;display:flex;align-items:center;line-height:1.15}
#fb.ok{border-color:#2e8b47;background:#e6f4ea;color:#1d4b2a}#fb.bad{border-color:#c62828;background:#fdecea;color:#7a1f1f}
#bins{position:absolute;left:26px;top:416px;width:1548px;height:300px;display:flex;gap:16px}
.bin{flex:1;background:#fff;border:4px solid #7a4a1e;border-radius:18px;position:relative;overflow:hidden}
.bin.hot{background:#fff3df;border-color:#c75000}
.bin h2{background:#7a4a1e;color:#fff8ea;font-size:25px;text-align:center;padding:6px 6px;line-height:1.1}
.bin .hint{font-size:17px;text-align:center;color:#6b5236;padding:3px 8px 0;line-height:1.12}
.bin .slot{position:absolute;left:8px;right:8px;top:var(--st,74px);bottom:6px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;justify-content:center}
.bin .card{width:var(--bw,146px);height:var(--bh,82px);border-width:4px;cursor:default}
.bin .card .cap{font-size:13px;padding:2px 4px}
</style>
</head>

'use strict';
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
let SCALE=1;
function fit(){const st=$('#stage');const s=Math.min(innerWidth/1600,innerHeight/900);SCALE=s;
  st.style.transform='translate(-50%,-50%) scale('+s+')';st.style.transformOrigin='50% 50%';
  st.style.left='50%';st.style.top='50%';st.style.marginLeft='0';
  st.style.transform='translate(-50%,-50%) scale('+s+')';}
addEventListener('resize',fit);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function msg(t,cls){const m=$('#msg');if(!m)return;m.textContent=t||'';m.className=cls||'';}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
/* stage koordinātas no rādītāja notikuma */
function spt(ev){const r=$('#stage').getBoundingClientRect();return {x:(ev.clientX-r.left)/r.width*1600,y:(ev.clientY-r.top)/r.height*900};}
function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement||null;}
function fsToggle(){const d=document.documentElement;
  try{ if(!fsEl()){ const f=d.requestFullscreen||d.webkitRequestFullscreen; if(!f){fsNo();return;}
        const p=f.call(d); if(p&&p.catch)p.catch(fsNo); }
       else { (document.exitFullscreen||document.webkitExitFullscreen).call(document); } }catch(e){fsNo();}}
function fsNo(){msg('Pilnekrāna režīms šajā lapā nav atļauts. Atver rīku jaunā cilnē.','bad');}
function fsLabel(){const b=$('#fs');if(b)b.textContent=fsEl()?'Iziet no pilnekrāna režīma':'Atvērt pilnekrāna režīmu';}
document.addEventListener('fullscreenchange',fsLabel);document.addEventListener('webkitfullscreenchange',fsLabel);
addEventListener('DOMContentLoaded',()=>{fit();const b=$('#fs');if(b){b.addEventListener('click',fsToggle);fsLabel();}});
/* taimeris ar Sākt/Apturēt */
function makeTimer(disp,secs,onEnd){let left=secs,id=null;
  const show=()=>{const m=Math.floor(left/60),s=left%60;disp.textContent=m+':'+String(s).padStart(2,'0');};
  show();
  return {start(){if(id||left<=0)return;id=setInterval(()=>{left--;show();if(left<=0){clearInterval(id);id=null;if(onEnd)onEnd();}},1000);},
          stop(){if(id){clearInterval(id);id=null;}},
          reset(n){this.stop();left=(n!=null?n:secs);secs=left;show();},
          running(){return !!id;},left(){return left;}};}


/* Šķirošanas dzinējs: vilkšana vai pieskāriens kartītei un pēc tam grozam. Atgriezeniskā saite uzreiz pēc ielikšanas. */
function Sorter(cfg){
  const deck=$('#deck'),binsEl=$('#bins');let sel=null,round=0,tries=0;
  function start(){
    const R=cfg.rounds[round];deck.innerHTML='';binsEl.innerHTML='';sel=null;tries=0;
    $('#deckLbl').textContent=R.label;
    R.bins.forEach(b=>{const d=el('div','bin');d.dataset.id=b.id;d.dataset.ok=b.ok||'';d.appendChild(el('h2',null,b.name));
      if(b.hint)d.appendChild(el('div','hint',b.hint));d.appendChild(el('div','slot'));
      d.addEventListener('click',()=>{if(sel)place(sel,d);});binsEl.appendChild(d);});
    shuffle(R.cards).forEach(c=>{const k=el('div','card');k.dataset.bin=c.bin;k.dataset.also=(c.also||[]).join(',');k.dataset.why=c.why||'';k.dataset.ok=c.ok||'';
      const im=el('img');im.src=IMG[c.img];im.alt=c.cap||'';im.draggable=false;k.appendChild(im);
      if(c.cap)k.appendChild(el('div','cap',c.cap));hook(k);deck.appendChild(k);});
    fb(R.task);
    $('#next').classList.add('hidden');
    $('#roundTag').textContent=(cfg.rounds.length>1?(round+1)+'. kārta no '+cfg.rounds.length:'');
    $('#roundTag').classList.toggle('hidden',cfg.rounds.length<2);
  }
  function fb(t,cls){const f=$('#fb');f.textContent=t;f.className=cls||'';}
  function place(k,bin){k.classList.remove('sel','good','wrong','drag');k.style.left=k.style.top='';
    sel=null;$$('.card.sel').forEach(x=>x.classList.remove('sel'));
    if(!bin){deck.appendChild(k);return;}
    $('.slot',bin).appendChild(k);
    if(k.dataset.bin===bin.dataset.id||k.dataset.also.split(',').includes(bin.dataset.id)){k.classList.add('good');k.dataset.done='1';
      const left=$$('.card',deck).length+$$('.card.wrong').length;
      if(!left){fb((cfg.rounds[round].done||'Kārta pabeigta! Visas kartītes ir savās vietās.')+(tries?' Kļūdas šajā kārtā: '+tries+'.':' Bez nevienas kļūdas!'),'ok');
        if(round<cfg.rounds.length-1)$('#next').classList.remove('hidden');}
      else fb('Pareizi! '+(k.dataset.ok||bin.dataset.ok||''),'ok');}
    else{tries++;k.classList.add('wrong');fb('Šis grozs neder. '+(k.dataset.why||'')+' Kartīte atgriežas pie pārējām – mēģini vēlreiz.','bad');
      setTimeout(()=>{if(k.classList.contains('wrong')&&k.parentNode&&k.parentNode.classList.contains('slot')){k.classList.remove('wrong');deck.appendChild(k);}},1800);}}
  function hook(k){let sx,sy,moved;
    k.addEventListener('pointerdown',ev=>{if(k.dataset.done)return;ev.preventDefault();const p=spt(ev);sx=p.x;sy=p.y;moved=false;
      const mv=e=>{const q=spt(e);if(!moved&&Math.hypot(q.x-sx,q.y-sy)>12){moved=true;
          const r=k.getBoundingClientRect(),s=$('#stage').getBoundingClientRect();
          k._ox=(q.x-(r.left-s.left)/s.width*1600);k._oy=(q.y-(r.top-s.top)/s.height*900);
          k.style.width=(r.width/s.width*1600)+'px';k.style.height=(r.height/s.height*900)+'px';
          $('#stage').appendChild(k);k.classList.add('drag');k.classList.remove('good','wrong');}
        if(moved){k.style.left=(q.x-k._ox)+'px';k.style.top=(q.y-k._oy)+'px';
          $$('.bin').forEach(b=>b.classList.toggle('hot',hit(b,e)));}};
      const up=e=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
        $$('.bin').forEach(b=>b.classList.remove('hot'));
        if(moved){k.style.width=k.style.height='';const b=$$('.bin').find(b=>hit(b,e));place(k,b||null);}
        else{const was=k.classList.contains('sel');$$('.card.sel').forEach(x=>x.classList.remove('sel'));
          if(!was){k.classList.add('sel');sel=k;fb('Tagad pieskaries grozam, kurā jāliek kartīte.');}else sel=null;}};
      addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);});
    k.addEventListener('click',e=>e.stopPropagation());}
  function hit(b,e){const r=b.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;}
  $('#again').addEventListener('click',start);
  $('#next').addEventListener('click',()=>{round++;start();});
  start();
}
