<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tekstarta konstruktors</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#3b2f25;
  font-family:Candara,"Segoe UI","Trebuchet MS",Verdana,Arial,sans-serif;color:#2d2118;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:0 0;
  background:#fbf5e9;overflow:hidden}
#top{position:absolute;left:0;top:0;width:1600px;height:84px;background:#7a4a1e;color:#fff8ea;
  display:flex;align-items:center;padding:0 34px;gap:22px}
#top h1{font-size:36px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
#top .sub{font-size:23px;opacity:.92;flex:1;line-height:1.2}
#top .tag{font-size:19px;background:#fff8ea;color:#7a4a1e;border-radius:20px;padding:6px 16px;font-weight:700;white-space:nowrap}
#main{position:absolute;left:0;top:84px;width:1600px;height:724px}
#bar{position:absolute;left:0;top:808px;width:1600px;height:92px;background:#efe3cc;border-top:3px solid #d9c6a3;
  display:flex;align-items:center;padding:0 26px;gap:16px}
#bar .sp{flex:1}
#msg{font-size:23px;font-weight:700;color:#5b3a17;flex:1;line-height:1.15;padding-right:10px;max-height:80px;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none}
.btn{height:62px;min-width:150px;padding:0 26px;border-radius:14px;font-size:25px;font-weight:700;
  background:#c75000;color:#fff;box-shadow:0 4px 0 #8f3a00}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8f3a00}
.btn.alt{background:#1f4e79;box-shadow:0 4px 0 #14334f}
.btn.alt:active{box-shadow:0 1px 0 #14334f}
.btn.soft{background:#fff8ea;color:#5b3a17;box-shadow:0 4px 0 #c9b48d;border:2px solid #c9b48d}
.btn.soft:active{box-shadow:0 1px 0 #c9b48d}
.btn[disabled]{opacity:.4;cursor:default}
#fs{background:#3b2f25;color:#fff8ea;box-shadow:0 4px 0 #1d1711;font-size:21px;min-width:0;padding:0 20px}
.ok{color:#1d6b2f}.bad{color:#b3261e}
.hidden{display:none!important}

#cv{position:absolute;left:26px;top:16px;width:1000px;height:692px;border-radius:16px;box-shadow:0 4px 12px rgba(60,40,10,.35);border:5px solid #fff;background:#fff}
#pan{position:absolute;left:1050px;top:16px;width:524px;height:692px}
.lab{font-size:22px;font-weight:700;color:#7a4a1e;margin:10px 0 6px}
.lab:first-child{margin-top:0}
#sil{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
#sil button{height:78px;border-radius:12px;background:#fff;border:4px solid #c9b48d;padding:5px}
#sil button img{width:100%;height:100%;object-fit:contain;pointer-events:none}
#sil button.on{border-color:#c75000;background:#fff3df}
#txt{width:100%;height:118px;border-radius:12px;border:4px solid #7a4a1e;font-family:inherit;font-size:27px;padding:10px 14px;resize:none;color:#2d2118;background:#fff;-webkit-user-select:text;user-select:text}
.row{display:flex;gap:8px}
.row button{flex:1;height:60px;border-radius:12px;background:#fff8ea;border:4px solid #c9b48d;font-size:22px;font-weight:700;color:#5b3a17;line-height:1.05}
.row button.on{border-color:#c75000;background:#ffe7c7}
#tip{font-size:21px;line-height:1.3;color:#4a3826;background:#fff;border:3px solid #d9c6a3;border-radius:12px;padding:10px 14px;margin-top:12px}
</style>
</head>
<body>
<div id="stage">
  <div id="top"><h1>Tekstarta konstruktors</h1><div class="sub">Veido tēlu tikai no burtiem un vārdiem.</div><div class="tag">5.2. Burti un cipari mākslā</div></div>
  <div id="main"><canvas id="cv" width="1000" height="692"></canvas>
<div id="pan">
<div class="lab">1. Izvēlies siluetu</div><div id="sil"></div>
<div class="lab">2. Ieraksti vārdus, kas stāsta par šo tēlu</div><textarea id="txt" maxlength="160" spellcheck="false" autocomplete="off"></textarea>
<div class="lab">3. Burtu lielums</div><div class="row" id="size"><button data-v="18">Mazi</button><button data-v="28" class="on">Vidēji</button><button data-v="42">Lieli</button><button data-v="mix">Dažādi</button></div>
<div class="lab">4. Kontrasts</div><div class="row" id="con"><button data-v="dark" class="on">Tumši burti, gaišs fons</button><button data-v="light">Gaiši burti, tumšs fons</button><button data-v="weak">Vājš kontrasts</button></div>
<div class="lab">5. Burtu krāsa</div><div class="row" id="col"><button data-v="one" class="on">Viena krāsa</button><button data-v="warm">Siltie toņi</button><button data-v="cool">Vēsie toņi</button></div>
<div id="tip"></div>
</div></div>
  <div id="bar"><div id="msg"></div><button class="btn alt" id="mixb">Sajaukt vārdus</button><button class="btn soft" id="again">Sākt no jauna</button><button class="btn" id="fs">Atvērt pilnekrāna režīmu</button></div>
</div>

'use strict';
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
let SCALE=1;
function fit(){const st=$('#stage');const s=Math.min(innerWidth/1600,innerHeight/900);SCALE=s;
  st.style.transform='translate(-50%,-50%) scale('+s+')';st.style.transformOrigin='50% 50%';
  st.style.left='50%';st.style.top='50%';st.style.marginLeft='0';
  st.style.transform='translate(-50%,-50%) scale('+s+')';}
addEventListener('resize',fit);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function msg(t,cls){const m=$('#msg');if(!m)return;m.textContent=t||'';m.className=cls||'';}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
/* stage koordinātas no rādītāja notikuma */
function spt(ev){const r=$('#stage').getBoundingClientRect();return {x:(ev.clientX-r.left)/r.width*1600,y:(ev.clientY-r.top)/r.height*900};}
function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement||null;}
function fsToggle(){const d=document.documentElement;
  try{ if(!fsEl()){ const f=d.requestFullscreen||d.webkitRequestFullscreen; if(!f){fsNo();return;}
        const p=f.call(d); if(p&&p.catch)p.catch(fsNo); }
       else { (document.exitFullscreen||document.webkitExitFullscreen).call(document); } }catch(e){fsNo();}}
function fsNo(){msg('Pilnekrāna režīms šajā lapā nav atļauts. Atver rīku jaunā cilnē.','bad');}
function fsLabel(){const b=$('#fs');if(b)b.textContent=fsEl()?'Iziet no pilnekrāna režīma':'Atvērt pilnekrāna režīmu';}
document.addEventListener('fullscreenchange',fsLabel);document.addEventListener('webkitfullscreenchange',fsLabel);
addEventListener('DOMContentLoaded',()=>{fit();const b=$('#fs');if(b){b.addEventListener('click',fsToggle);fsLabel();}});
/* taimeris ar Sākt/Apturēt */
function makeTimer(disp,secs,onEnd){let left=secs,id=null;
  const show=()=>{const m=Math.floor(left/60),s=left%60;disp.textContent=m+':'+String(s).padStart(2,'0');};
  show();
  return {start(){if(id||left<=0)return;id=setInterval(()=>{left--;show();if(left<=0){clearInterval(id);id=null;if(onEnd)onEnd();}},1000);},
          stop(){if(id){clearInterval(id);id=null;}},
          reset(n){this.stop();left=(n!=null?n:secs);secs=left;show();},
          running(){return !!id;},left(){return left;}};}


const SIL=[["lapa", "Lapa", "LAPA ZAĻA VĒJŠ RUDENS KOKS"], ["putns", "Putns", "PUTNS LIDO SPĀRNI DEBESIS DZIESMA"], ["zivs", "Zivs", "ZIVS PELD ŪDENS VIĻŅI JŪRA"], ["kakis", "Kaķis", "KAĶIS MURRĀ ŪSAS ĶEPAS MIEGS"], ["koks", "Koks", "KOKS SAKNES ZARI LAPAS ĒNA"], ["taurins", "Tauriņš", "TAURIŅŠ ZIEDS VASARA KRĀSAS"]];
let cur=0,size='28',con='dark',col='one',mask=null,seed=1;
const cv=$('#cv'),cx=cv.getContext('2d');
function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647;}
function loadMask(cb){const im=new Image();im.onload=()=>{mask=document.createElement('canvas');mask.width=1000;mask.height=692;const g=mask.getContext('2d');
    g.fillStyle='#fff';g.fillRect(0,0,1000,692);const s=Math.min(1000/im.width,692/im.height)*0.95;const w=im.width*s,h=im.height*s;
    g.drawImage(im,(1000-w)/2,(692-h)/2,w,h);const d=g.getImageData(0,0,1000,692);const p=d.data;
    for(let i=0;i<p.length;i+=4){const a=255-Math.round((p[i]+p[i+1]+p[i+2])/3);p[i]=p[i+1]=p[i+2]=0;p[i+3]=a;}g.putImageData(d,0,0);cb();};im.src=IMG[SIL[cur][0]];}
function words(){const t=$('#txt').value.replace(/\s+/g,' ').trim();return t?t.split(' '):[];}
const PAL={one:null,warm:['#c62828','#e65100','#f9a825','#ad1457','#bf360c'],cool:['#1565c0','#00838f','#2e7d32','#4527a0','#0277bd']};
const lay=document.createElement('canvas');lay.width=1000;lay.height=692;const lx=lay.getContext('2d');
function draw(){if(!mask)return;const W=words();seed=7+cur*13;
  const bg=con==='light'?'#1c2733':(con==='weak'?'#d9d2c3':'#fffdf7');const fg=con==='light'?'#fff8e1':(con==='weak'?'#c4bba8':'#2d2118');
  cx.globalCompositeOperation='source-over';cx.fillStyle=bg;cx.fillRect(0,0,1000,692);
  lx.globalCompositeOperation='source-over';lx.clearRect(0,0,1000,692);
  if(!W.length){lx.fillStyle=con==='light'?'#33475c':'#e9dfcb';lx.fillRect(0,0,1000,692);lx.globalCompositeOperation='destination-in';lx.drawImage(mask,0,0);cx.drawImage(lay,0,0);
    cx.fillStyle=con==='light'?'#fff8e1':'#7a4a1e';cx.font='700 28px Candara,"Segoe UI",Arial,sans-serif';cx.textAlign='center';cx.fillText('Ieraksti vārdus – tie aizpildīs siluetu.',500,678);cx.textAlign='left';
    msg('Ieraksti vārdus labajā pusē.');return;}
  let wi=0,y=-4;const pal=PAL[col];lx.textBaseline='top';
  while(y<692){const fs=size==='mix'?[18,26,36,50][Math.floor(rnd()*4)]:+size;const lh=Math.round(fs*0.98);
    lx.font='800 '+fs+'px Candara,"Segoe UI","Trebuchet MS",Arial,sans-serif';let x=-Math.floor(rnd()*fs*2);
    while(x<1000){const w=W[wi%W.length].toUpperCase();lx.fillStyle=pal?pal[wi%pal.length]:fg;lx.fillText(w,x,y);x+=lx.measureText(w).width+fs*0.3;wi++;}
    y+=lh;}
  lx.globalCompositeOperation='destination-in';lx.drawImage(mask,0,0);cx.drawImage(lay,0,0);
  msg(con==='weak'?'Vājš kontrasts: burti gandrīz saplūst ar fonu. Vai tēlu vēl var atpazīt?':'Siluetu veido tikai burti. Atkāpies no tāfeles – vai tēlu var atpazīt?');}
function setRow(id,v){$$('#'+id+' button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));}
function pick(k){const t=$('#txt');if(!t.value.trim()||SIL.some(x=>x[2]===t.value))t.value=SIL[k][2];cur=k;$$('#sil button').forEach((b,i)=>b.classList.toggle('on',i===k));
  $('#tip').innerHTML='<b>Padoms.</b> Tēls: '+SIL[k][1].toLowerCase()+'. Raksti lietvārdus, darbības vārdus un īpašības vārdus. Jo vairāk dažādu vārdu, jo interesantāks tekstarts.';
  loadMask(draw);}
addEventListener('DOMContentLoaded',()=>{const s=$('#sil');SIL.forEach((x,k)=>{const b=el('button');const im=el('img');im.src=IMG[x[0]];im.alt=x[1];b.title=x[1];b.appendChild(im);b.addEventListener('click',()=>pick(k));s.appendChild(b);});
  $('#txt').addEventListener('input',draw);
  $$('#size button').forEach(b=>b.addEventListener('click',()=>{size=b.dataset.v;setRow('size',size);draw();}));
  $$('#con button').forEach(b=>b.addEventListener('click',()=>{con=b.dataset.v;setRow('con',con);draw();}));
  $$('#col button').forEach(b=>b.addEventListener('click',()=>{col=b.dataset.v;setRow('col',col);draw();}));
  $('#mixb').addEventListener('click',()=>{const w=shuffle(words());$('#txt').value=w.join(' ');draw();});
  $('#again').addEventListener('click',()=>{$('#txt').value='';size='28';con='dark';col='one';setRow('size',size);setRow('con',con);setRow('col',col);pick(0);});
  $('#txt').value=SIL[0][2];pick(0);});

</script>
