<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ciparu šifrs</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#3b2f25;
  font-family:Candara,"Segoe UI","Trebuchet MS",Verdana,Arial,sans-serif;color:#2d2118;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:0 0;
  background:#fbf5e9;overflow:hidden}
#top{position:absolute;left:0;top:0;width:1600px;height:84px;background:#7a4a1e;color:#fff8ea;
  display:flex;align-items:center;padding:0 34px;gap:22px}
#top h1{font-size:36px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
#top .sub{font-size:23px;opacity:.92;flex:1;line-height:1.2}
#top .tag{font-size:19px;background:#fff8ea;color:#7a4a1e;border-radius:20px;padding:6px 16px;font-weight:700;white-space:nowrap}
#main{position:absolute;left:0;top:84px;width:1600px;height:724px}
#bar{position:absolute;left:0;top:808px;width:1600px;height:92px;background:#efe3cc;border-top:3px solid #d9c6a3;
  display:flex;align-items:center;padding:0 26px;gap:16px}
#bar .sp{flex:1}
#msg{font-size:23px;font-weight:700;color:#5b3a17;flex:1;line-height:1.15;padding-right:10px;max-height:80px;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none}
.btn{height:62px;min-width:150px;padding:0 26px;border-radius:14px;font-size:25px;font-weight:700;
  background:#c75000;color:#fff;box-shadow:0 4px 0 #8f3a00}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8f3a00}
.btn.alt{background:#1f4e79;box-shadow:0 4px 0 #14334f}
.btn.alt:active{box-shadow:0 1px 0 #14334f}
.btn.soft{background:#fff8ea;color:#5b3a17;box-shadow:0 4px 0 #c9b48d;border:2px solid #c9b48d}
.btn.soft:active{box-shadow:0 1px 0 #c9b48d}
.btn[disabled]{opacity:.4;cursor:default}
#fs{background:#3b2f25;color:#fff8ea;box-shadow:0 4px 0 #1d1711;font-size:21px;min-width:0;padding:0 20px}
.ok{color:#1d6b2f}.bad{color:#b3261e}
.hidden{display:none!important}

#tabs{position:absolute;left:26px;top:14px;display:flex;gap:12px}
.tab{height:58px;padding:0 26px;border-radius:14px 14px 0 0;font-size:25px;font-weight:700;background:#e4d5b7;color:#5b3a17}
.tab.on{background:#7a4a1e;color:#fff8ea}
#key{position:absolute;left:26px;top:72px;width:430px;height:640px;background:#fff;border:4px solid #7a4a1e;border-radius:0 16px 16px 16px;padding:14px 18px}
#key h2{font-size:27px;color:#7a4a1e;margin-bottom:4px}
#key p{font-size:20px;line-height:1.25;color:#4a3826;margin-bottom:8px}
.krow{display:flex;align-items:center;gap:14px;height:74px;border-top:2px solid #efe3cc;font-size:30px;font-weight:700}
.krow svg{width:92px;height:62px;flex:0 0 auto}.krow .eq{color:#7a4a1e}
.krow .rom{width:92px;text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:44px}
#work{position:absolute;left:476px;top:74px;width:1098px;height:638px}
#task{font-size:30px;font-weight:700;color:#3b2a1a;height:66px;display:flex;align-items:center;line-height:1.15}
#tablet{position:absolute;left:0;top:70px;width:700px;height:390px;border-radius:18px;overflow:hidden;border:5px solid #fff;box-shadow:0 4px 12px rgba(60,40,10,.4);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center}
#tablet .g{background:rgba(255,255,255,.62);border-radius:16px;min-width:300px;min-height:150px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;max-width:660px;padding:14px}
#tablet svg{width:86px;height:86px}
#tablet .rom{font-family:Georgia,"Times New Roman",serif;font-size:120px;font-weight:700;color:#3d2c1c;letter-spacing:8px;text-shadow:1px 2px 0 rgba(255,255,255,.5)}
#tablet .big{font-size:150px;font-weight:700;color:#3d2c1c;text-shadow:1px 2px 0 rgba(255,255,255,.5)}
.maya{display:flex;flex-direction:column;gap:10px;align-items:center}
.lvl{width:230px;height:146px;border:3px dashed rgba(60,40,20,.45);border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(255,255,255,.18)}
.lvl svg{width:200px!important;height:130px!important}
.lvl .lab{position:absolute;left:-150px;width:140px;text-align:right;font-size:20px;font-weight:700;color:#3d2c1c;text-shadow:0 0 6px #fff,0 0 6px #fff}
.lvl.act{border-color:#c75000;border-style:solid;background:rgba(255,240,215,.45)}
#side{position:absolute;left:724px;top:70px;width:374px;height:390px}
#ans{height:84px;border-radius:14px;background:#fff;border:4px solid #7a4a1e;font-size:60px;font-weight:700;text-align:center;line-height:76px;color:#2d2118}
#pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
#pad button{height:62px;border-radius:12px;background:#fff8ea;border:3px solid #c9b48d;font-size:34px;font-weight:700;color:#3b2a1a}
#pad button:active{background:#f1dfbd}
#gl{display:flex;flex-wrap:wrap;gap:10px;margin-top:0}
#gl button{width:118px;height:112px;border-radius:12px;background:#fff8ea;border:3px solid #c9b48d;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:19px;font-weight:700;color:#5b3a17}
#gl button svg{width:74px;height:62px}#gl button .rom{font-family:Georgia,serif;font-size:46px;line-height:1.1;color:#3d2c1c}
#gl button.wide{width:100%;height:60px;flex-direction:row;font-size:23px}
#fact{position:absolute;left:0;top:476px;width:1098px;height:162px;background:#fff;border:3px solid #d9c6a3;border-radius:16px;padding:16px 22px;font-size:25px;line-height:1.32}
#fact b{color:#7a4a1e}
#prog{font-size:22px;font-weight:700;color:#7a4a1e;white-space:nowrap}
</style>
</head>

  <div id="main"><div id="tabs"></div><div id="key"></div>
<div id="work"><div id="task"></div><div id="tablet"><div class="g"></div></div><div id="side"></div><div id="fact"></div></div></div>
  <div id="bar"><div id="msg"></div><span id="prog"></span><button class="btn" id="check">Pārbaudīt</button><button class="btn alt" id="next" disabled>Nākamais uzdevums</button><button class="btn" id="fs">Atvērt pilnekrāna režīmu</button></div>

'use strict';
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
let SCALE=1;
function fit(){const st=$('#stage');const s=Math.min(innerWidth/1600,innerHeight/900);SCALE=s;
  st.style.transform='translate(-50%,-50%) scale('+s+')';st.style.transformOrigin='50% 50%';
  st.style.left='50%';st.style.top='50%';st.style.marginLeft='0';
  st.style.transform='translate(-50%,-50%) scale('+s+')';}
addEventListener('resize',fit);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function msg(t,cls){const m=$('#msg');if(!m)return;m.textContent=t||'';m.className=cls||'';}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
/* stage koordinātas no rādītāja notikuma */
function spt(ev){const r=$('#stage').getBoundingClientRect();return {x:(ev.clientX-r.left)/r.width*1600,y:(ev.clientY-r.top)/r.height*900};}
function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement||null;}
function fsToggle(){const d=document.documentElement;
  try{ if(!fsEl()){ const f=d.requestFullscreen||d.webkitRequestFullscreen; if(!f){fsNo();return;}
        const p=f.call(d); if(p&&p.catch)p.catch(fsNo); }
       else { (document.exitFullscreen||document.webkitExitFullscreen).call(document); } }catch(e){fsNo();}}
function fsNo(){msg('Pilnekrāna režīms šajā lapā nav atļauts. Atver rīku jaunā cilnē.','bad');}
function fsLabel(){const b=$('#fs');if(b)b.textContent=fsEl()?'Iziet no pilnekrāna režīma':'Atvērt pilnekrāna režīmu';}
document.addEventListener('fullscreenchange',fsLabel);document.addEventListener('webkitfullscreenchange',fsLabel);
addEventListener('DOMContentLoaded',()=>{fit();const b=$('#fs');if(b){b.addEventListener('click',fsToggle);fsLabel();}});
/* taimeris ar Sākt/Apturēt */
function makeTimer(disp,secs,onEnd){let left=secs,id=null;
  const show=()=>{const m=Math.floor(left/60),s=left%60;disp.textContent=m+':'+String(s).padStart(2,'0');};
  show();
  return {start(){if(id||left<=0)return;id=setInterval(()=>{left--;show();if(left<=0){clearInterval(id);id=null;if(onEnd)onEnd();}},1000);},
          stop(){if(id){clearInterval(id);id=null;}},
          reset(n){this.stop();left=(n!=null?n:secs);secs=left;show();},
          running(){return !!id;},left(){return left;}};}


const INK='#3d2c1c';
function svg(inner,vb){return '<svg viewBox="'+(vb||'0 0 100 100')+'" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+inner+'</svg>';}
const G={
 e1:()=>svg('<rect x="43" y="14" width="14" height="72" rx="5" fill="'+INK+'"/>'),
 e10:()=>svg('<path d="M22 86 V46 A28 28 0 0 1 78 46 V86" fill="none" stroke="'+INK+'" stroke-width="13" stroke-linecap="round"/>'),
 e100:()=>svg('<path d="M30 90 C52 88 78 78 78 52 C78 30 60 16 44 18 C28 20 20 34 24 46 C28 58 42 62 50 54 C56 48 52 40 46 40" fill="none" stroke="'+INK+'" stroke-width="10" stroke-linecap="round"/>'),
 dot:()=>'<circle r="13" fill="'+INK+'"/>',
};
function mayaSvg(n){ /* 0..19 vienā līmenī */
  let s='';const bars=Math.floor(n/5),dots=n%5;const W=200,H=130;
  if(n===0){s='<path d="M24 65 C50 18 150 18 176 65 C150 112 50 112 24 65 Z" fill="none" stroke="'+INK+'" stroke-width="9" stroke-linejoin="round"/>'+
    '<path d="M62 44 C56 58 56 72 62 86 M100 36 C94 55 94 75 100 94 M138 44 C144 58 144 72 138 86" fill="none" stroke="'+INK+'" stroke-width="7" stroke-linecap="round"/>';}
  else{const rows=bars+(dots?1:0);const rh=28,gap=6;let y=(H-(rows*rh+(rows-1)*gap))/2;
    if(dots){const sp=34,x0=W/2-(dots-1)*sp/2;for(let k=0;k<dots;k++)s+='<circle cx="'+(x0+k*sp)+'" cy="'+(y+rh/2)+'" r="12" fill="'+INK+'"/>';y+=rh+gap;}
    for(let k=0;k<bars;k++){s+='<rect x="30" y="'+(y+4)+'" width="140" height="20" rx="8" fill="'+INK+'"/>';y+=rh+gap;}}
  return svg(s,'0 0 200 130');}
function roman(n){const m=[[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let r='';m.forEach(([v,s])=>{while(n>=v){r+=s;n-=v;}});return r;}
function egyptHtml(n){let h='';const c=Math.floor(n/100),x=Math.floor(n%100/10),i=n%10;
  for(let k=0;k<c;k++)h+=G.e100();for(let k=0;k<x;k++)h+=G.e10();for(let k=0;k<i;k++)h+=G.e1();return h;}
const SYS=[
 {id:'eg',name:'Senā Ēģipte',bg:'stone1',
  key:'<h2>Ēģiptiešu skaitļu zīmes</h2><p>Vieniem, desmitiem un simtiem ir katram sava zīme. Zīmi atkārto tik reižu, cik vajag, un visu saskaita.</p>'+
   '<div class="krow">'+G.e1()+'<span class="eq">= 1</span></div><div class="krow">'+G.e10()+'<span class="eq">= 10</span></div><div class="krow">'+G.e100()+'<span class="eq">= 100</span></div>'+
   '<p style="margin-top:10px">Piemērs: divi loki un trīs svītras ir 10 + 10 + 1 + 1 + 1 = 23.</p>',
  fact:'<b>Vai zināji?</b> Senajā Ēģiptē 1 apzīmēja ar svītru, 10 – ar loku, 100 – ar virves rituli. Nulles zīmes šajā pierakstā nebija. Zīmju secība skaitļa vērtību nemainīja.',
  dec:[23,41,132,205,318],enc:[34,120,213]},
 {id:'ro',name:'Senā Roma',bg:'stone2',
  key:'<h2>Romiešu cipari</h2><p>Ciparus raksta ar burtiem. Ja mazāka zīme ir pirms lielākas, to atņem: IV = 4, IX = 9, XL = 40, XC = 90.</p>'+
   '<div class="krow"><span class="rom">I</span><span class="eq">= 1</span></div><div class="krow"><span class="rom">V</span><span class="eq">= 5</span></div><div class="krow"><span class="rom">X</span><span class="eq">= 10</span></div><div class="krow"><span class="rom">L</span><span class="eq">= 50</span></div><div class="krow"><span class="rom">C</span><span class="eq">= 100</span></div>',
  fact:'<b>Vai zināji?</b> Romiešu ciparus lieto arī mūsdienās: pulksteņu ciparnīcās, gadsimtu apzīmējumos un grāmatu nodaļu numuros. Romiešiem nebija nulles zīmes.',
  dec:[7,14,29,46,90],enc:[8,19,64]},
 {id:'ma',name:'Maiju zeme',bg:'stone3',
  key:'<h2>Maiju skaitļi</h2><p>Maiji skaitīja pa divdesmit. Skaitli raksta vertikāli: apakšā – vieni (0–19), virs tiem – divdesmiti.</p>'+
   '<div class="krow">'+mayaSvg(1)+'<span class="eq">= 1</span></div><div class="krow">'+mayaSvg(5)+'<span class="eq">= 5</span></div><div class="krow">'+mayaSvg(0)+'<span class="eq">= 0</span></div>'+
   '<p style="margin-top:10px">Piemērs: augšā 1 punkts (1 × 20), apakšā svītra un 2 punkti (7). Kopā 27.</p>',
  fact:'<b>Vai zināji?</b> Maijiem bija nulles zīme – gliemežvāks. Ar punktu, svītru un gliemežvāku viņi pierakstīja arī ļoti lielus skaitļus, piemēram, dienu skaitu kalendārā.',
  dec:[4,8,13,27,40],enc:[9,17,26]}
];
let si=0,ti=0,T=null,ans='',cnt=null,lvl=0,solved=false;
function tasks(S){return S.dec.map(n=>({k:'dec',n})).concat(S.enc.map(n=>({k:'enc',n})));}
function drawTabs(){const t=$('#tabs');t.innerHTML='';SYS.forEach((S,k)=>{const b=el('button','tab'+(k===si?' on':''),S.name);b.addEventListener('click',()=>{si=k;ti=0;load();});t.appendChild(b);});}
function load(){const S=SYS[si];drawTabs();$('#key').innerHTML=S.key;$('#fact').innerHTML=S.fact;$('#tablet').style.backgroundImage='url('+IMG[S.bg]+')';
  const L=tasks(S);T=L[ti];solved=false;ans='';cnt={c:0,x:0,i:0,r:'',m:[0,0]};lvl=0;
  $('#prog').textContent='Uzdevums '+(ti+1)+' no '+L.length;$('#next').disabled=true;$('#check').disabled=false;
  $('#next').textContent=(ti<L.length-1)?'Nākamais uzdevums':(si<SYS.length-1?'Nākamā kultūra':'Sākt no jauna');
  if(T.k==='dec'){$('#task').textContent='Atšifrē! Kāds skaitlis ir pierakstīts uz akmens plāksnes?';showGlyphs(T.n);pad();msg('Ieraksti skaitli ar pogām un spied „Pārbaudīt”.');}
  else{$('#task').textContent='Tagad uzraksti šo skaitli ar '+(S.id==='eg'?'ēģiptiešu zīmēm':S.id==='ro'?'romiešu cipariem':'maiju zīmēm')+': '+T.n;builder();msg('Saliec skaitli no zīmēm un spied „Pārbaudīt”.');}
}
function showGlyphs(n){const g=$('#tablet .g');const S=SYS[si];
  if(S.id==='eg')g.innerHTML=egyptHtml(n);else if(S.id==='ro')g.innerHTML='<span class="rom">'+roman(n)+'</span>';
  else g.innerHTML=mayaStack(Math.floor(n/20),n%20,n>=20,-1);}
function mayaStack(hi,lo,two,act){let h='<div class="maya">';
  if(two)h+='<div class="lvl'+(act===1?' act':'')+'" data-l="1"><span class="lab">× 20</span>'+(hi||act<0?mayaSvg(hi):'')+'</div>';
  h+='<div class="lvl'+(act===0?' act':'')+'" data-l="0"><span class="lab">× 1</span>'+((lo||act<0)?mayaSvg(lo):'')+'</div></div>';return h;}
function pad(){const s=$('#side');s.innerHTML='<div id="ans"></div><div id="pad"></div>';const p=$('#pad');
  ['1','2','3','4','5','6','7','8','9','Dzēst','0','←'].forEach(k=>{const b=el('button',null,k);if(k==='Dzēst')b.style.fontSize='24px';
    b.addEventListener('click',()=>{if(solved)return;if(k==='Dzēst')ans='';else if(k==='←')ans=ans.slice(0,-1);else if(ans.length<3)ans=(ans==='0'?'':ans)+k;$('#ans').textContent=ans;});p.appendChild(b);});}
function builder(){const S=SYS[si],s=$('#side');s.innerHTML='<div id="gl"></div>';const gl=$('#gl');
  const add=(html,lab,fn,cls)=>{const b=el('button',cls||'');b.innerHTML=html+(lab?'<span>'+lab+'</span>':'');b.addEventListener('click',()=>{if(solved)return;fn();redraw();});gl.appendChild(b);};
  if(S.id==='eg'){add(G.e100(),'100',()=>{if(cnt.c<9)cnt.c++;});add(G.e10(),'10',()=>{if(cnt.x<9)cnt.x++;});add(G.e1(),'1',()=>{if(cnt.i<9)cnt.i++;});}
  else if(S.id==='ro'){['C','L','X','V','I'].forEach(ch=>add('<span class="rom">'+ch+'</span>','',()=>{if(cnt.r.length<8)cnt.r+=ch;}));}
  else{add(mayaSvg(1),'punkts',()=>{if(cnt.m[lvl]<19)cnt.m[lvl]+=1;});add(mayaSvg(5),'svītra',()=>{if(cnt.m[lvl]<=14)cnt.m[lvl]+=5;});
       add('','Mainīt līmeni (× 1 vai × 20)',()=>{lvl=lvl?0:1;},'wide');}
  add('','Noņemt pēdējo zīmi',()=>{if(S.id==='eg'){if(cnt.i)cnt.i--;else if(cnt.x)cnt.x--;else if(cnt.c)cnt.c--;}
     else if(S.id==='ro')cnt.r=cnt.r.slice(0,-1);else{const v=cnt.m[lvl];if(v%5)cnt.m[lvl]--;else if(v)cnt.m[lvl]-=5;}},'wide');
  add('','Notīrīt plāksni',()=>{cnt={c:0,x:0,i:0,r:'',m:[0,0]};},'wide');redraw();}
function redraw(){const S=SYS[si],g=$('#tablet .g');
  if(S.id==='eg'){let h='';for(let k=0;k<cnt.c;k++)h+=G.e100();for(let k=0;k<cnt.x;k++)h+=G.e10();for(let k=0;k<cnt.i;k++)h+=G.e1();g.innerHTML=h;}
  else if(S.id==='ro')g.innerHTML='<span class="rom">'+cnt.r+'</span>';
  else{g.innerHTML=mayaStack(cnt.m[1],cnt.m[0],true,lvl);$$('.lvl',g).forEach(d=>d.addEventListener('click',()=>{if(solved)return;lvl=+d.dataset.l;redraw();}));}}
function check(){const S=SYS[si];let ok=false,hint='';
  if(T.k==='dec'){if(ans===''){msg('Vispirms ieraksti skaitli.','bad');return;}ok=(+ans===T.n);
    hint=S.id==='ma'?(T.n<20?'Punkts ir 1, svītra ir 5. Saskaiti tos.':'Saskaiti katru līmeni atsevišķi: augšējo reizini ar 20, apakšējo pieskaiti.'):S.id==='ro'?'Skaties, vai mazāka zīme nav pirms lielākas – tad to atņem.':'Saskaiti atsevišķi rituļus, lokus un svītras.';}
  else if(S.id==='eg'){ok=(cnt.c*100+cnt.x*10+cnt.i===T.n);hint='Sadali skaitli simtos, desmitos un vienos.';}
  else if(S.id==='ro'){ok=(cnt.r===roman(T.n));hint=cnt.r?'Vienu zīmi pēc kārtas raksta ne vairāk kā 3 reizes. V un L neatkārto. 4, 9, 40 un 90 raksta ar atņemšanu: IV, IX, XL, XC.':'Saliec skaitli no burtiem.';}
  else{ok=(cnt.m[1]*20+cnt.m[0]===T.n&&cnt.m[0]<20);hint='Apakšējā līmenī drīkst būt ne vairāk par 19. Pilnus divdesmitus liec augšējā līmenī.';}
  if(ok){solved=true;msg('Pareizi! Tas ir skaitlis '+T.n+'.','ok');$('#next').disabled=false;$('#check').disabled=true;
    if(T.k==='dec'){$('#ans').textContent=T.n;}}
  else msg('Vēl nav pareizi. '+hint,'bad');}
$('#check').addEventListener('click',check);
$('#next').addEventListener('click',()=>{const L=tasks(SYS[si]);if(ti<L.length-1)ti++;else{si=(si+1)%SYS.length;ti=0;}load();});
addEventListener('DOMContentLoaded',load);

</script>
</body>
</html>
